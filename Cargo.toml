[workspace]
members = [
    ".",
    "crates/canonical-auth",
    "crates/canonical-config",
    "crates/canonical-session",
    "crates/canonical-store",
    "services/canonical-session-revoker",
]
resolver = "2"

[workspace.dependencies]
sea-orm = { version = "2.0.0", default-features = false }
sea-orm-migration = { version = "2.0.0", default-features = false }

[package]
name = "canonical-web-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
default-run = "canonical-web-server"

[features]
default = []
# Browser e2e only. build.rs and src/lib.rs independently reject production
# profiles, and the provider still requires an exact runtime opt-in.
test-auth = []

[dependencies]
canonical-lib = { git = "https://github.com/canonical-cloud/canonical-lib-core.git", default-features = false, features = ["read-only"] }  # avenue 1: reads only, enforced by the compiler
ores-transport = { git = "https://github.com/ORESoftware/ores-transport.git", branch = "main" }  # TODO(DEN): pin to a rev once ores-transport is pushed
k8s-web-api-data-plane = { git = "https://github.com/ORESoftware/k8s-libs-and-shared-defs.git", rev = "55adadc9f6d223d40b28ae66097dfe16930951b1", package = "k8s-web-api-data-plane" }
aes-gcm = "0.11.0"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.0"
canonical-auth = { path = "crates/canonical-auth" }
canonical-config = { path = "crates/canonical-config" }
canonical-interfaces = { git = "https://github.com/canonical-cloud/canonical-interfaces", rev = "0cab33c2b2a494d2368ef1da0ebe5d614b3a96ef" }
canonical-session = { path = "crates/canonical-session" }
canonical-store = { path = "crates/canonical-store" }
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.32"
hmac = "0.13.0"
maud = { version = "0.27.0", features = ["axum"] }
next-loggers = { git = "https://github.com/ores-otel/ores.otel.log", rev = "ca176fb6768a9750d262a536952268625ffd3a8a", package = "oresoftware-next-loggers" }
opentelemetry = "0.32"
opentelemetry-http = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
sea-orm = { workspace = true, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite", "with-chrono", "with-json", "with-uuid"] }
sea-orm-migration = { workspace = true, features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite", "with-chrono", "with-json", "with-uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "0.11.0"
shared-auth-client = { git = "https://github.com/shared-auth/shared-auth-clients", rev = "cc57a85b276bee81ad94decc87df2f48d49cab9f", package = "shared-auth-client" }
thiserror = "2.0.18"
time = "=0.3.54"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["compression-gzip", "fs", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[dev-dependencies]
# Router-level tests drive the app with `oneshot` and read the response body
# without binding a socket.
http-body-util = "0.1.3"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

# --- functional programming conformance -------------------------------------
# Warn level only: these never fail a build. They fail `cargo clippy -- -D warnings`
# in the nightly job. See FP-GUIDELINES.md for the principle behind each group.

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
# typed errors: panicking is not error handling
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
# illegal states excluded by types
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# immutable values and pure transformations
mut_mut = "warn"
needless_pass_by_ref_mut = "warn"
# composition
too_many_lines = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
# explicit inputs and outputs
must_use_candidate = "warn"
return_self_not_must_use = "warn"
