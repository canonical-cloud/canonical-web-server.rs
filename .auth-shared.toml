schema_version = 1

[compatibility]
repository = "https://github.com/shared-auth/shared-auth-interfaces"
commit = "f62d9dbed2db6774dda04586328e6c485423fff6"

[factors.two_factor]
required = false
methods = ["totp", "passkey", "security-key"]

[factors.three_factor]
enabled = false
methods = ["totp", "passkey", "security-key"]

[pages]
show = ["sign-in", "sign-up", "challenge", "recovery", "consent", "error", "signed-out"]

[styling]
theme = "system"
brand_name = "Canonical Cloud"
accent_color = "#4F46E5"