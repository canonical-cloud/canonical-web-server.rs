name: ORES web Lambda source certification

on:
  pull_request:
    paths:
      - "src/pages/**"
      - ".github/workflows/ores-web-lambda-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-web-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Canonical web source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out exact ores-stack candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-stack
          ref: d92a0f32aabbed0b61b1e91d51d8efa70899a8c2
          path: .cert/ores-stack
          persist-credentials: false
          show-progress: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Build exact ores-stack CLI
        working-directory: .cert/ores-stack
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo build --locked -p ores-stack-cli

      - name: Generate web sibling lambda.rs from real Canonical pages
        shell: bash
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/.cert/ores-stack/target/debug/ores-stack"
          test -x "$CLI"
          test -d src/pages

          find src/pages -type f \( -name page.rs -o -name gen.rs \) -print0 \
            | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/authored-before.sha256"

          "$CLI" --root "$GITHUB_WORKSPACE" build --no-exec \
            | tee "$RUNNER_TEMP/build.log"

          find src/pages -type f \( -name page.rs -o -name gen.rs \) -print0 \
            | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/authored-after.sha256"
          cmp "$RUNNER_TEMP/authored-before.sha256" "$RUNNER_TEMP/authored-after.sha256"

      - name: Prove one neutral authenticated sibling per page
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PAGES < <(find src/pages -type f -name page.rs | sort)
          mapfile -t LAMBDAS < <(find src/pages -type f -name lambda.rs | sort)
          test "${#PAGES[@]}" -gt 0
          test "${#PAGES[@]}" -eq "${#LAMBDAS[@]}"

          for page in "${PAGES[@]}"; do
            lambda="$(dirname "$page")/lambda.rs"
            test -f "$lambda"
            grep -F '// @generated by ores-api-docs for a *-web-server.rs page; DO NOT EDIT.' "$lambda"
            grep -F 'pub const ORES_PAGE_AUTH: &str = "session";' "$lambda"
            grep -F 'ores_page_admit_request' "$lambda"
            ! grep -F 'admit_public_page' "$lambda"
            grep -F 'pub async fn init_state()' "$lambda"
            grep -F 'pub async fn admit(' "$lambda"
            grep -F 'pub async fn run(' "$lambda"
            ! grep -F 'fn main()' "$lambda"
            ! grep -F 'lambda_runtime' "$lambda"
            ! grep -F 'aws_lambda_events' "$lambda"
            ! grep -F 'AWS_LAMBDA_RUNTIME_API' "$lambda"
            ! grep -F 'K_SERVICE' "$lambda"
            ! grep -F 'FUNCTION_TARGET' "$lambda"
            ! grep -F 'azure_functions' "$lambda"
            ! grep -F 'std::env::var("PORT")' "$lambda"
          done

          # Web pages never gain an RPC projection merely because they can be
          # deployed as a Lambda/Cloud Run function.
          test -z "$(find src/pages -type f -name rpc.rs -print -quit)"

      - name: Require byte-exact generated-source check
        shell: bash
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/.cert/ores-stack/target/debug/ores-stack"
          "$CLI" --root "$GITHUB_WORKSPACE" check
          git diff --check

      - name: Retain generated source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ores-web-lambda-certification"
          mkdir -p "$OUT/lambdas"
          git diff --binary -- src/pages > "$OUT/generated.patch" || true
          cp "$RUNNER_TEMP/build.log" "$OUT/build.log" 2>/dev/null || true
          while IFS= read -r lambda; do
            rel="${lambda#src/pages/}"
            safe="${rel//\//__}"
            cp "$lambda" "$OUT/lambdas/$safe"
          done < <(find src/pages -type f -name lambda.rs | sort)
          git status --short > "$OUT/git-status.txt"

      - name: Upload exact generated evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-web-ores-lambda-source-certification
          path: ${{ runner.temp }}/ores-web-lambda-certification
          if-no-files-found: error
          retention-days: 7
