name: Quote cutover branch fix

on:
  push:
    branches:
      - agent/quote-api-integration-v2

permissions:
  contents: write

concurrency:
  group: quote-cutover-branch-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact cutover branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/quote-api-integration-v2
          persist-credentials: true

      - name: Apply the deterministic token-contract repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/ci.yml')
          text = workflow.read_text()
          old = 'CANONICAL_WEB_SERVICE_TOKEN'
          new = 'CANONICAL_INTERNAL_AUTH_TOKEN'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale smoke token name, found {text.count(old)}')
          workflow.write_text(text.replace(old, new))

          original_main = subprocess.check_output(
              ['git', 'show', 'e69841cdccdae1036817e3f2d9f33729e1dd63ca:src/main.rs'],
              text=True,
          )
          Path('src/main.rs').write_text(original_main)
          Path('.github/workflows/quote-cutover-branch-fix.yml').unlink()
          PY
          git diff --check
          grep -Fq 'CANONICAL_INTERNAL_AUTH_TOKEN=ci-only-' .github/workflows/ci.yml
          ! grep -Fq 'CANONICAL_WEB_SERVICE_TOKEN' .github/workflows/ci.yml

      - name: Commit the clean branch repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml src/main.rs .github/workflows/quote-cutover-branch-fix.yml
          git commit -m 'fix: align quote smoke token contract'
          git push origin HEAD:agent/quote-api-integration-v2
