name: Apply event-listener security lock update

on:
  push:
    branches: [agent/den-127-finalize-hierarchy]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95"
      - name: Resolve the RustSec-patched release
        run: |
          cargo update -p event-listener --precise 5.4.2
          git diff --check -- Cargo.lock
          test -n "$(git diff --name-only -- Cargo.lock)"
      - name: Commit only the generated lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- Cargo.lock
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          git commit -m "Update event-listener to patched 5.4.2"
          git push origin HEAD:agent/den-127-finalize-hierarchy
