name: Generate event-listener lock update

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95"
      - name: Resolve the patched event-listener release
        run: cargo update -p event-listener --precise 5.4.2
      - name: Print reverse dependency path
        run: cargo tree --locked --invert event-listener
      - name: Print the generated lockfile patch
        run: |
          git diff --check -- Cargo.lock
          git diff -- Cargo.lock
          test -n "$(git diff --name-only -- Cargo.lock)"
