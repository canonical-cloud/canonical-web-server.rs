name: rkyv dependency path diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - name: Print inverse rkyv feature tree
        run: cargo tree --locked --workspace --all-targets --invert rkyv@0.7.46 --edges features
