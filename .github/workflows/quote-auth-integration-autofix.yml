name: Quote auth integration branch autofix

on:
  push:
    branches:
      - feat/canonical-plus-quote-platform

permissions:
  contents: write

concurrency:
  group: quote-auth-integration-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[quote-auth-autofix]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/canonical-plus-quote-platform
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Apply deterministic integration repairs
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          schema = Path("deploy/postgres/schema.sql")
          text = schema.read_text()
          old = "owner_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,"
          if text.count(old) != 1:
              raise SystemExit(f"expected one quote owner FK in declarative schema, found {text.count(old)}")
          schema.write_text(text.replace(old, "owner_id uuid NOT NULL,"))

          cockroach = Path("tests/cockroach_rls.rs")
          text = cockroach.read_text()
          text, policy_count_changes = re.subn(
              r"policy_count,\s*8,",
              "policy_count, 10,",
              text,
              count=1,
          )
          if policy_count_changes != 1:
              raise SystemExit("expected Cockroach policy-count value was not found")
          old_message = "expected seven owner policies plus the web-session process boundary"
          if text.count(old_message) != 1:
              raise SystemExit("expected Cockroach policy-count message was not found")
          text = text.replace(
              old_message,
              "expected owner/process policies plus quote-owner and context-read boundaries",
          )
          text, rls_table_changes = re.subn(
              r"(,\s*'web_session')(\s*\n\s*\))",
              r"\1, 'canonical_context', 'compliance_quote'\2",
              text,
              count=1,
          )
          if rls_table_changes != 1:
              raise SystemExit("expected Cockroach forced-RLS web_session entry was not found")
          cockroach.write_text(text)

          quotes = Path("src/quotes.rs")
          text = quotes.read_text()
          ping_pattern = re.compile(
              r"Some\(Ok\(Message::Ping\(payload\)\)\)\s*=>\s*\{\s*"
              r"if outgoing\.send\(Message::Pong\(payload\)\)\.await\.is_err\(\)\s*\{\s*"
              r"break;\s*\}\s*\}"
          )
          replacement = """Some(Ok(Message::Ping(payload)))
                      if outgoing.send(Message::Pong(payload.clone())).await.is_err() =>
                  {
                      break;
                  }"""
          text, ping_changes = ping_pattern.subn(replacement, text, count=1)
          if ping_changes != 1:
              raise SystemExit("expected WebSocket ping match was not found")
          quotes.write_text(text)
          PY

      - name: Regenerate lockfile without orphan packages
        run: cargo generate-lockfile

      - name: Explain rkyv reverse dependency
        run: cargo tree --target all -i rkyv || true

      - name: Format
        run: cargo fmt --all

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test with annotated failure output
        shell: bash
        run: |
          set +e
          cargo test --workspace --all-features --no-fail-fast -- --nocapture 2>&1 | tee /tmp/cargo-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 <<'PY'
          from pathlib import Path
          log = Path('/tmp/cargo-test.log').read_text(errors='replace')
          tail = log[-15000:]
          escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Cargo test failure::{escaped}')
          PY
            exit "$status"
          fi

      - name: Verify patch
        run: |
          git diff --check
          if grep -q 'name = "rkyv"' Cargo.lock; then
            echo "rkyv remains in Cargo.lock" >&2
            cargo tree --target all -i rkyv || true
            exit 1
          fi
          git diff --stat

      - name: Commit deterministic autofix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock deploy/postgres/schema.sql tests/cockroach_rls.rs src
          git commit -m "fix: integrate Shared Auth quote identity [quote-auth-autofix]"
          git push origin HEAD:feat/canonical-plus-quote-platform
