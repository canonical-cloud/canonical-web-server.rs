name: verify published containers

on:
  pull_request:
    paths:
      - .github/workflows/publish-containers.yml
      - .github/workflows/verify-published-containers.yml
      - release/current-containers.env
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-containers.yml
      - .github/workflows/verify-published-containers.yml
      - release/current-containers.env
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  declaration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release declaration and source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release declaration
        shell: bash
        run: |
          set -euo pipefail
          source release/current-containers.env
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PACKAGE" = 'ghcr.io/canonical-cloud/canonical-web-server-rs'
          test "$WEB_IMAGE" = "${PACKAGE}:web-${SOURCE_SHA}"
          test "$REVOKER_IMAGE" = "${PACKAGE}:revoker-${SOURCE_SHA}"
          git cat-file -e "${SOURCE_SHA}^{commit}"

      - name: Validate publisher proof and permission-probe contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/publish-containers.yml
          grep -F 'probe_image="${PACKAGE}:permission-probe"' "$workflow"
          grep -F 'docker push "$probe_image"' "$workflow"
          grep -F 'docker push "$WEB_IMAGE"' "$workflow"
          grep -F 'docker push "$REVOKER_IMAGE"' "$workflow"
          grep -F 'docker pull --quiet "$WEB_IMAGE"' "$workflow"
          grep -F 'docker pull --quiet "$REVOKER_IMAGE"' "$workflow"
          grep -F 'canonical-containers/published' "$workflow"
          grep -F 'statuses/${SOURCE_SHA}' "$workflow"

      - name: Explain post-merge evidence
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Immutable release handoff

          The previous component package names were writable only by another package
          owner and returned `permission_denied: write_package`. This declaration uses
          one repository-owned package with `web-<sha>` and `revoker-<sha>` tags.

          After merge, `publish containers` first pushes and pulls a tiny permission
          probe, then builds the declared source revision, pushes both immutable
          component tags, removes the local copies, pulls both images back from GHCR,
          inspects their revision/user/entrypoint contracts, and writes the
          `canonical-containers/published` commit status on the declared source SHA.
          EOF
