name: verify published containers

on:
  pull_request:
    paths:
      - .github/workflows/verify-published-containers.yml
      - release/current-containers.env
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-published-containers.yml
      - release/current-containers.env
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release declaration and source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release declaration
        shell: bash
        run: |
          set -euo pipefail
          source release/current-containers.env
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WEB_IMAGE" = "ghcr.io/canonical-cloud/canonical-web-server:${SOURCE_SHA}"
          test "$REVOKER_IMAGE" = "ghcr.io/canonical-cloud/canonical-session-revoker:${SOURCE_SHA}"
          git cat-file -e "${SOURCE_SHA}^{commit}"

      - name: Authenticate for package reads
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Pull and inspect both immutable images
        shell: bash
        run: |
          set -euo pipefail
          source release/current-containers.env
          docker pull --quiet "$WEB_IMAGE"
          docker pull --quiet "$REVOKER_IMAGE"

          test "$(docker image inspect "$WEB_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$REVOKER_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$WEB_IMAGE" --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect "$REVOKER_IMAGE" --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect "$WEB_IMAGE" --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/canonical-web-server"]'
          test "$(docker image inspect "$REVOKER_IMAGE" --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/canonical-session-revoker"]'

          {
            echo '## Verified immutable Canonical Cloud release'
            echo
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Web: \`${WEB_IMAGE}\`"
            echo "- Revoker: \`${REVOKER_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io || true
