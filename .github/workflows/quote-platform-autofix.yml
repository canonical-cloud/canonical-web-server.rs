name: Quote platform branch autofix

on:
  push:
    branches:
      - feat/canonical-plus-quote-platform

permissions:
  contents: write

concurrency:
  group: quote-platform-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[quote-autofix]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/canonical-plus-quote-platform
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Converge quote schema and runtime grants
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          quote_path = Path("db/quote-schema.sql")
          quote_sql = quote_path.read_text()
          embedded_grants = """DO $roles$
          BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'canonical_web_server') THEN
              GRANT SELECT ON canonical_context TO canonical_web_server;
              GRANT SELECT, INSERT, UPDATE ON compliance_quote TO canonical_web_server;
            END IF;
          END
          $roles$;
          """
          if embedded_grants not in quote_sql:
              raise SystemExit("expected embedded quote grant block was not found")
          quote_path.write_text(quote_sql.replace(embedded_grants, ""))

          schema_path = Path("deploy/postgres/schema.sql")
          schema_sql = schema_path.read_text()
          if "CREATE TABLE public.canonical_context" in schema_sql:
              raise SystemExit("quote tables already exist in declarative schema")
          quote_schema = r'''

          -- Compliance quote desired state. Runtime grants are deliberately
          -- maintained in bootstrap_runtime_role.sql because dpm does not diff grants.
          CREATE TABLE public.canonical_context (
            id uuid PRIMARY KEY,
            context_key text NOT NULL,
            version integer NOT NULL CHECK (version > 0),
            context_markdown text NOT NULL CHECK (octet_length(context_markdown) <= 65536),
            active boolean NOT NULL DEFAULT true,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now(),
            UNIQUE (context_key, version)
          );

          CREATE INDEX canonical_context_active_key_idx
            ON public.canonical_context (context_key, active, version DESC);

          CREATE TABLE public.compliance_quote (
            id uuid PRIMARY KEY,
            owner_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
            status text NOT NULL CHECK (status IN ('queued', 'analyzing', 'ready', 'failed')),
            request jsonb NOT NULL CHECK (jsonb_typeof(request) = 'object'),
            analysis jsonb CHECK (analysis IS NULL OR jsonb_typeof(analysis) = 'object'),
            model text NOT NULL CHECK (length(model) BETWEEN 1 AND 128),
            failure_code text CHECK (failure_code IS NULL OR length(failure_code) <= 100),
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now(),
            CHECK ((status = 'ready') = (analysis IS NOT NULL)),
            CHECK (status = 'failed' OR failure_code IS NULL)
          );

          CREATE INDEX compliance_quote_owner_created_idx
            ON public.compliance_quote (owner_id, created_at DESC);
          CREATE INDEX compliance_quote_owner_status_idx
            ON public.compliance_quote (owner_id, status, updated_at DESC);

          ALTER TABLE public.canonical_context ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.canonical_context FORCE ROW LEVEL SECURITY;
          ALTER TABLE public.compliance_quote ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.compliance_quote FORCE ROW LEVEL SECURITY;

          CREATE POLICY canonical_context_runtime_read ON public.canonical_context
            FOR SELECT
            USING (current_user = 'canonical_web_server' AND active = true);

          CREATE POLICY compliance_quote_owner ON public.compliance_quote
            USING (owner_id = auth.uid())
            WITH CHECK (owner_id = auth.uid());
          '''
          schema_path.write_text(schema_sql.rstrip() + quote_schema.rstrip() + "\n")

          bootstrap_path = Path("deploy/postgres/bootstrap_runtime_role.sql")
          bootstrap_sql = bootstrap_path.read_text()
          allowlist = """GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE
            public.user_profile,
            public.web_session,
            public.sync_record,
            public.sync_clock,
            public.sync_change,
            public.sync_receipt,
            public.audit_engagement,
            public.engagement_note
          TO canonical_web_server;
          """
          if allowlist not in bootstrap_sql:
              raise SystemExit("expected runtime table allow-list was not found")
          replacement = allowlist + """

          GRANT SELECT ON TABLE
            public.canonical_context
          TO canonical_web_server;

          GRANT SELECT, INSERT, UPDATE ON TABLE
            public.compliance_quote
          TO canonical_web_server;
          """
          bootstrap_path.write_text(bootstrap_sql.replace(allowlist, replacement))
          PY

      - name: Format Rust
        run: cargo fmt --all

      - name: Show vulnerable reverse dependency
        run: cargo tree --locked --target all -i rkyv

      - name: Verify patch
        run: |
          git diff --check
          git diff --stat

      - name: Commit deterministic autofix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/quote-schema.sql deploy/postgres/schema.sql deploy/postgres/bootstrap_runtime_role.sql src
          git commit -m "chore: converge quote schema and formatting [quote-autofix]"
          git push origin HEAD:feat/canonical-plus-quote-platform
