name: Release boundary policy regression

on:
  pull_request:
    paths:
      - "tests/release-boundary*.mjs"
      - ".github/workflows/release-boundary-regression.yml"
  push:
    branches: [main]
    paths:
      - "tests/release-boundary*.mjs"
      - ".github/workflows/release-boundary-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out PR commit and log Git tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          if [[ "$actual" != "$EXPECTED_HEAD" ]]; then
            echo "::error::Checkout mismatch; expected $EXPECTED_HEAD but got $actual"
            exit 1
          fi
          printf 'Verified head commit: %s\nVerified source Git-tree: %s\n' "$actual" "$tree"
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate release boundary detector (positive and adversarial cases)
        run: node --test tests/release-boundary-policy.test.mjs
