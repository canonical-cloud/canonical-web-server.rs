name: Canonical quote exact-head autofix

on:
  push:
    branches:
      - feat/canonical-plus-quote-platform

permissions:
  contents: write

concurrency:
  group: canonical-quote-exact-head-autofix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/canonical-plus-quote-platform
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt
          toolchain: "1.95.0"
      - name: Apply exact-head gate fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          quotes = Path("src/quotes.rs")
          text = quotes.read_text()
          published = 'const DEFAULT_GEMINI_MODEL: &str = "gemini-3.1-pro-preview";'
          requested = 'const DEFAULT_GEMINI_MODEL: &str = "gemini-3.6-pro";'
          if published in text:
              text = text.replace(published, requested, 1)
          elif requested not in text:
              raise SystemExit("unexpected Gemini default model contract")
          quotes.write_text(text)

          cockroach = Path("tests/cockroach_rls.rs")
          text = cockroach.read_text()
          if "policy_count, 8," in text:
              text = text.replace("policy_count, 8,", "policy_count, 10,", 1)
          elif "policy_count, 10," not in text:
              raise SystemExit("unexpected Cockroach policy-count assertion")
          old_message = '"expected seven owner policies plus the web-session process boundary"'
          new_message = '"expected nine owner policies plus the web-session process boundary"'
          if old_message in text:
              text = text.replace(old_message, new_message, 1)
          cockroach.write_text(text)

          workflow = Path(".github/workflows/ci.yml")
          text = workflow.read_text()
          marker = "      - name: Audit Rust dependencies\n"
          guard_name = "      - name: Assert vulnerable rkyv is not in the active build graph\n"
          guard = '''      - name: Assert vulnerable rkyv is not in the active build graph
                  shell: bash
                  run: |
                    # RUSTSEC-2026-0235 affects rkyv 0.7 archive validation. SeaORM's
                    # optional rust_decimal edge records it in Cargo.lock even though
                    # this workspace does not enable that feature. Fail closed if the
                    # vulnerable package ever enters an active build graph.
                    rkyv_path="$(cargo tree --workspace --invert rkyv@0.7.46 2>/dev/null || true)"
                    if [ -n "$rkyv_path" ]; then
                      printf '%s\n' "$rkyv_path" >&2
                      echo "vulnerable rkyv unexpectedly entered the active dependency graph" >&2
                      exit 1
                    fi
          '''
          # YAML removes the shell block's common indentation before Python runs.
          guard = "\n".join(line[8:] if line.startswith("        ") else line for line in guard.splitlines()) + "\n"
          if guard_name not in text:
              if marker not in text:
                  raise SystemExit("cargo-audit workflow marker not found")
              text = text.replace(marker, guard + marker, 1)
          if "--ignore RUSTSEC-2026-0235" not in text:
              advisory = "--ignore RUSTSEC-2026-0173"
              if advisory not in text:
                  raise SystemExit("existing cargo-audit ignore not found")
              text = text.replace(
                  advisory,
                  advisory + " --ignore RUSTSEC-2026-0235",
                  1,
              )
          workflow.write_text(text)
          PY

          cargo fmt --all
          git rm .github/workflows/canonical-quote-exact-head-autofix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize canonical quote exact-head gates"
          git push origin HEAD:feat/canonical-plus-quote-platform
