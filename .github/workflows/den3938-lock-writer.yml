name: DEN-3938 temporary lock writer

on:
  push:
    branches:
      - DEN-3938/split-web-audit-database
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/den3938-lock-writer.yml"

permissions:
  contents: write

jobs:
  repin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: DEN-3938/split-web-audit-database
          persist-credentials: true
          fetch-depth: 1
      - name: Apply exact reviewed source substitutions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.lock')
          text = p.read_text()
          replacements = {
            'git+https://github.com/canonical-cloud/canonical-lib-core?rev=54ce24670694b1f920e4ab69043378db24fd7296#54ce24670694b1f920e4ab69043378db24fd7296':
            'git+https://github.com/canonical-cloud/canonical-lib-core?rev=6e833326ec2974912a4b66ebfc65f27b705abcba#6e833326ec2974912a4b66ebfc65f27b705abcba',
            'git+https://github.com/canonical-cloud/canonical-orm-core?rev=954fd9811b9c6db1acf15d3a282e65395e347b5a#954fd9811b9c6db1acf15d3a282e65395e347b5a':
            'git+https://github.com/canonical-cloud/canonical-orm-core?rev=5547c4c2f5c177be83788b3976505a5c942a991b#5547c4c2f5c177be83788b3976505a5c942a991b',
          }
          for old, new in replacements.items():
              if text.count(old) != 1 or text.count(new) != 0:
                  raise SystemExit(f'unexpected lock source state for {old}')
              text = text.replace(old, new)
          p.write_text(text)
          PY
          test "$(git diff --name-only | tr -d '\r')" = "Cargo.lock"
          test "$(git diff --numstat Cargo.lock | awk '{print $1":"$2}')" = "2:2"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: repin hardened persistence lock'
          git push origin HEAD:DEN-3938/split-web-audit-database
