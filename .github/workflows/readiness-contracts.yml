name: readiness-contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
      - name: Recompute readiness TypeSpec and JSON Schema peer parity
        uses: ORESoftware/typespec-json-schema-validator@ac946cb7b7d1f3a59171f3663f5fcdfa543fb31d
        with:
          typespec: vendor/canonical-auditor-readiness/readiness/contract/main.tsp
          schema: vendor/canonical-auditor-readiness/readiness/response.schema.json
          report: .typespec-json-schema-validator/web-readiness-report.json
          contract_ir: .typespec-json-schema-validator/web-readiness-contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          instances: vendor/canonical-auditor-readiness/readiness/contract/instances
          max_probes: "128"
          quiet: "false"
      - name: Verify exact Contract IR before browser/runtime consumption
        uses: ORESoftware/typespec-json-schema-validator/actions/verify-contract-ir@ac946cb7b7d1f3a59171f3663f5fcdfa543fb31d
        with:
          contract_ir: .typespec-json-schema-validator/web-readiness-contract-ir.json
          report: .typespec-json-schema-validator/web-readiness-report.json
          typespec: vendor/canonical-auditor-readiness/readiness/contract/main.tsp
          schema: vendor/canonical-auditor-readiness/readiness/response.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: '["CanonicalReadiness.DateString","CanonicalReadiness.FrameworkId","CanonicalReadiness.Identifier","CanonicalReadiness.ReadinessAnswer","CanonicalReadiness.ReadinessContext","CanonicalReadiness.ReadinessResponse","CanonicalReadiness.ReadinessStatus"]'
          verification: .typespec-json-schema-validator/web-readiness-consumer-verification.json
      - name: Prove altered evidence and incomplete scopes fail closed downstream
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@ac946cb7b7d1f3a59171f3663f5fcdfa543fb31d
        with:
          contract_ir: .typespec-json-schema-validator/web-readiness-contract-ir.json
          report: .typespec-json-schema-validator/web-readiness-report.json
          typespec: vendor/canonical-auditor-readiness/readiness/contract/main.tsp
          schema: vendor/canonical-auditor-readiness/readiness/response.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: '["CanonicalReadiness.DateString","CanonicalReadiness.FrameworkId","CanonicalReadiness.Identifier","CanonicalReadiness.ReadinessAnswer","CanonicalReadiness.ReadinessContext","CanonicalReadiness.ReadinessResponse","CanonicalReadiness.ReadinessStatus"]'
          verification: .typespec-json-schema-validator/web-readiness-regression-verification.json
