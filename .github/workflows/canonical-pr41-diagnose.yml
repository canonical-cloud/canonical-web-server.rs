name: Diagnose Canonical PR 41 exact head

on:
  push:
    branches:
      - ci/canonical-pr41-diagnose
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: feat/canonical-plus-quote-platform-release
      EXPECTED_HEAD: e8b36be4c48a250e1522ec7c7c437ef667a7cd8f
    steps:
      - name: Check out helper branch with write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Add one-run dependency path diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse "origin/$TARGET_BRANCH")"
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo "release branch moved from expected exact head: $remote_head" >&2
            exit 1
          fi
          git checkout -B "$TARGET_BRANCH" "$EXPECTED_HEAD"
          python3 <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/ci.yml")
          text = workflow.read_text()
          marker = "          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json\n"
          diagnostic = (
              "          echo \"Resolved dependency path to rkyv 0.7.46:\"\n"
              "          cargo tree --workspace --locked --invert rkyv@0.7.46 --edges normal,build,dev || true\n"
          )
          if diagnostic not in text:
              if marker not in text:
                  raise SystemExit("rkyv metadata guard marker was not found")
              text = text.replace(marker, diagnostic + marker, 1)
          workflow.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/ci.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci: expose resolved rkyv dependency path"
          git push origin "HEAD:$TARGET_BRANCH"
