name: Diagnose Canonical PR 41 exact head

on:
  push:
    branches:
      - ci/canonical-pr41-diagnose
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_SHA: 055b6fb224c705d07fd93dd66970fb6cf3d07c17
    steps:
      - name: Check out immutable release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
      - name: Assert immutable source head
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Show resolved rkyv path and features
        shell: bash
        run: |
          set -euo pipefail
          echo '=== reverse normal/build/dev path ==='
          cargo tree --workspace --locked --invert rkyv@0.7.46 --edges normal,build,dev
          echo '=== reverse feature path ==='
          cargo tree --workspace --locked --invert rkyv@0.7.46 --edges features
          echo '=== rust_decimal feature path ==='
          cargo tree --workspace --locked --invert rust_decimal --edges features || true
          echo '=== packages mentioning rkyv in resolved metadata ==='
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
          jq -r '.packages[] | select(.name == "rkyv" or .name == "rust_decimal" or .name == "sea-orm" or .name == "sea-query") | [.name,.version,.id] | @tsv' /tmp/cargo-metadata.json
