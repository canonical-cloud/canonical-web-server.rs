name: Diagnose Canonical SeaORM decimal feature path

on:
  push:
    branches:
      - ci/canonical-pr41-diagnose
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_SHA: 459d18e8248de7802c82b280232977cdf7c517cb
      SEA_ORM_SHA: fd3d3de8a37df4ff790ff1661bb572b9ec1350d0
    steps:
      - name: Check out immutable release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
      - name: Assert immutable source head
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Apply the first migration-default correction
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/SeaQL/sea-orm.git /tmp/sea-orm
          git -C /tmp/sea-orm checkout --quiet "$SEA_ORM_SHA"
          test "$(git -C /tmp/sea-orm rev-parse HEAD)" = "$SEA_ORM_SHA"
          mkdir -p vendor
          cp -R /tmp/sea-orm/sea-orm-migration vendor/sea-orm-migration
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("vendor/sea-orm-migration/Cargo.toml")
          text = manifest.read_text()
          old = '''sea-orm = { version = "~2.0.0", path = "../", features = [
              "schema-sync",
          ] }'''
          new = '''sea-orm = { version = "~2.0.0", default-features = false, features = [
              "schema-sync",
          ] }'''
          if old not in text:
              raise SystemExit("unexpected upstream sea-orm dependency declaration")
          text = text.replace(old, new, 1)
          text = text.replace(
              'sea-orm-cli = { version = "~2.0.0", path = "../sea-orm-cli", default-features = false, optional = true }',
              'sea-orm-cli = { version = "~2.0.0", default-features = false, optional = true }',
              1,
          )
          manifest.write_text(text)

          root = Path("Cargo.toml")
          text = root.read_text()
          root.write_text(
              text.rstrip()
              + "\n\n[patch.crates-io]\n"
              + 'sea-orm-migration = { path = "vendor/sea-orm-migration" }\n'
          )
          PY
          cargo update -p sea-orm-migration@2.0.0 --precise 2.0.0
      - name: Print exact active feature owners
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
          echo '=== Cargo feature tree: rust_decimal ==='
          cargo tree --workspace --locked --invert rust_decimal -e features || true
          echo '=== Cargo feature tree: rkyv 0.7.46 ==='
          cargo tree --workspace --locked --invert rkyv@0.7.46 -e features || true
          echo '=== Cargo feature tree: SeaORM ==='
          cargo tree --workspace --locked --invert sea-orm@2.0.0 -e features || true
          echo '=== Metadata reverse graph ==='
          python3 <<'PY'
          import json
          from collections import defaultdict, deque

          with open('/tmp/cargo-metadata.json', encoding='utf-8') as stream:
              metadata = json.load(stream)

          packages = {package['id']: package for package in metadata['packages']}
          nodes = {node['id']: node for node in metadata['resolve']['nodes']}
          reverse = defaultdict(list)
          for parent_id, node in nodes.items():
              for dependency in node.get('dependencies', []):
                  reverse[dependency].append(parent_id)

          interesting_names = {
              'rkyv', 'rust_decimal', 'sea-orm', 'sea-orm-migration',
              'sea-query', 'sea-query-sqlx', 'sea-query-binder', 'sea-orm-cli',
              'sqlx', 'sqlx-core', 'sqlx-postgres', 'sqlx-sqlite',
          }
          for package_id, package in sorted(packages.items(), key=lambda item: (item[1]['name'], item[1]['version'])):
              if package['name'] in interesting_names and package_id in nodes:
                  print(f"NODE {package['name']} {package['version']}")
                  print('  features=' + ','.join(nodes[package_id].get('features', [])))
                  for parent_id in reverse.get(package_id, []):
                      parent = packages[parent_id]
                      print(
                          f"  parent={parent['name']} {parent['version']} "
                          f"features={','.join(nodes[parent_id].get('features', []))}"
                      )

          targets = [
              package_id for package_id, package in packages.items()
              if package['name'] == 'rust_decimal'
          ]
          for target in targets:
              print(f"REVERSE PATHS TO {packages[target]['name']} {packages[target]['version']}")
              queue = deque([(target, [target])])
              seen = {target}
              while queue:
                  current, path = queue.popleft()
                  parents = reverse.get(current, [])
                  if not parents:
                      labels = [f"{packages[item]['name']} {packages[item]['version']}" for item in reversed(path)]
                      print('  ' + ' -> '.join(labels))
                  for parent in parents:
                      if parent not in seen:
                          seen.add(parent)
                          queue.append((parent, path + [parent]))
          PY
          echo '=== Resolved package feature declarations ==='
          jq -r '.packages[] | select(.name == "sea-orm" or .name == "sea-orm-migration" or .name == "sea-query" or .name == "sea-query-sqlx" or .name == "rust_decimal") | "PACKAGE \(.name) \(.version)\n" + (.features | to_entries | map("  \(.key)=\(.value|join(","))") | join("\n"))' /tmp/cargo-metadata.json
