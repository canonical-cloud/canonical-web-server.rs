name: Apply requested Gemini default to PR 39

on:
  push:
    branches:
      - ci/canonical-pr39-model-default

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: feat/canonical-plus-quote-platform-reviewed
    steps:
      - name: Check out repository with write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Apply user-selected model default only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/quotes.rs")
          text = path.read_text()
          old = 'const DEFAULT_GEMINI_MODEL: &str = "gemini-3.1-pro-preview";'
          new = 'const DEFAULT_GEMINI_MODEL: &str = "gemini-3.6-pro";'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit("expected configurable Gemini model default was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then
            echo "requested model default is already present"
            exit 0
          fi
          test "$(git diff --name-only)" = "src/quotes.rs"
          test "$(git diff --numstat | awk '{print $1 ":" $2 ":" $3}')" = "1:1:src/quotes.rs"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quotes.rs
          git commit -m "fix: default quotes to Gemini 3.6 Pro"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            echo "target moved during push; rebasing attempt $attempt" >&2
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
          done
          exit 1
