name: Apply requested Gemini default to PR 39

on:
  push:
    branches:
      - ci/canonical-pr39-model-default

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: feat/canonical-plus-quote-platform-reviewed
      EXPECTED_HEAD: 5e4657a6c96677cd907c2d5ca78cb96c42492b5f
    steps:
      - name: Check out reviewed exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Apply user-selected model default
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse "origin/$TARGET_BRANCH")"
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo "target branch moved from reviewed head: $remote_head" >&2
            exit 1
          fi
          git checkout -B "$TARGET_BRANCH" "$EXPECTED_HEAD"
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/quotes.rs")
          text = path.read_text()
          old = 'const DEFAULT_GEMINI_MODEL: &str = "gemini-3.1-pro-preview";'
          new = 'const DEFAULT_GEMINI_MODEL: &str = "gemini-3.6-pro";'
          if old not in text:
              raise SystemExit("reviewed model default was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all --check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quotes.rs
          git commit -m "fix: default quotes to Gemini 3.6 Pro"
          git push origin "HEAD:$TARGET_BRANCH"
