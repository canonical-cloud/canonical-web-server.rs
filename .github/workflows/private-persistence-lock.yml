name: Offline private Cargo pin contract

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "services/**"
      - "scripts/verify-private-dependency-lock.mjs"
      - "tests/private-dependency-lock.test.mjs"
      - ".github/workflows/private-persistence-lock.yml"
  push:
    branches: [main, dev]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "services/**"
      - "scripts/verify-private-dependency-lock.mjs"
      - "tests/private-dependency-lock.test.mjs"
      - ".github/workflows/private-persistence-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit and record Git tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'Source commit: %s\nSource Git tree: %s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Exercise pin-contract regression tests
        run: node --test tests/private-dependency-lock.test.mjs
      - name: Verify immutable Git manifest and lockfile references
        run: node scripts/verify-private-dependency-lock.mjs
      - name: State authenticated build boundary explicitly
        run: |
          echo 'Offline pin contract passed.'
          echo 'Authenticated private Cargo graph, regenerated lock parity,'
          echo 'security audit and Rust compilation still require trusted private integration CI.'
