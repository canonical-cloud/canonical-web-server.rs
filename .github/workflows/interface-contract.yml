name: canonical interface consumer contract

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg/**'
      - 'contracts/interfaces-source.lock.json'
      - 'scripts/verify-interface-dependency.py'
      - 'src/routes/health.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/interface-contract.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: interface-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interface-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify one dependency authority across Zed, Cargo, and source
        run: python3 scripts/verify-interface-dependency.py
      - name: Require approved private Canonical dependency credential
        env:
          CANONICAL_LIB_READ_TOKEN: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CANONICAL_LIB_READ_TOKEN" ]]; then
            echo '::error::CANONICAL_LIB_READ_TOKEN is required only for the compile/lifecycle phase; credential-free interface parity already passed.'
            exit 1
          fi
      - name: Compile every Rust consumer without changing the lock
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.CANONICAL_LIB_READ_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: cargo check --workspace --all-targets --locked
      - name: Prove the lifecycle hook is the same release gate
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.CANONICAL_LIB_READ_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: sh ./.zpkg/pre-build
