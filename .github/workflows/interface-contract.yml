name: canonical interface consumer contract

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg/**'
      - 'contracts/interfaces-source.lock.json'
      - 'scripts/verify-interface-dependency.py'
      - 'src/routes/health.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/interface-contract.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify one dependency authority across Zed, Cargo, and source
        run: python3 scripts/verify-interface-dependency.py
      - name: Compile every Rust consumer without changing the lock
        run: cargo check --workspace --all-targets --locked
      - name: Prove the lifecycle hook is the same release gate
        run: sh ./.zpkg/pre-build
