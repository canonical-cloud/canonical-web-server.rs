name: canonical interface consumer contract

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg/**'
      - 'contracts/interfaces-source.lock.json'
      - 'scripts/verify-interface-dependency.py'
      - 'src/routes/health.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/interface-contract.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: interface-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interface-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify one dependency authority across Zed, Cargo, and source
        run: python3 scripts/verify-interface-dependency.py
      - name: Preserve application-repository credential boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'Authenticated private-Cargo compilation is intentionally owned by canonical-monorepo.'
          echo 'This application workflow proves only the credential-free interface/provenance contract.'
