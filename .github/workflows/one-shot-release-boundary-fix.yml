name: one-shot-release-boundary-fix

on:
  push:
    branches: [audit/org-policy-rollout-20260915]
    paths:
      - .github/workflows/one-shot-release-boundary-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/org-policy-rollout-20260915
          persist-credentials: false
      - name: Admit only the immutable read-only organization policy caller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/release-boundary.mjs')
          text = path.read_text()
          old = '''const allowedReadOnlyReusableWorkflows = new Set([
            "canonical-cloud/canonical.cloud/.github/workflows/agents-hierarchy.yml@202c89a988a9adaa43f5113d9d0d1d009bf60e3b",
          ]);'''
          new = '''const allowedReadOnlyReusableWorkflows = new Set([
            "canonical-cloud/canonical.cloud/.github/workflows/agents-hierarchy.yml@202c89a988a9adaa43f5113d9d0d1d009bf60e3b",
            "canonical-cloud/.github/.github/workflows/reusable-policy.yml@0ea46201f6a0055aa5d28c465488394d3c2c56c0",
          ]);'''
          if old not in text:
              raise SystemExit('release-boundary allowlist did not match; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY
          node tests/release-boundary.mjs
          git diff --check
      - name: Commit test hardening and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-release-boundary-fix.yml
          git add tests/release-boundary.mjs
          git commit -m "test: distinguish read-only policy reuse from publishing"
          askpass="$RUNNER_TEMP/git-askpass.sh"
          cat >"$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:audit/org-policy-rollout-20260915
          rm -f "$askpass"
