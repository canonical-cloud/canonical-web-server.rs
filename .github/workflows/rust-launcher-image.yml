name: Rust launcher image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        target: [web, api, revoker]
        include:
          - target: web
            app: /usr/local/bin/canonical-web-server
          - target: api
            app: /usr/local/bin/canonical-api-server
          - target: revoker
            app: /usr/local/bin/canonical-session-revoker
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every binary compiles the shared crate containing embedded readiness
          # assets, so every target needs every committed gitlink initialized.
          submodules: recursive
      - name: Validate pin, compile-time assets, and host smoke script
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[0-9a-f]{40}$' docker/ores-launcher.rev
          test "$(wc -l < docker/ores-launcher.rev)" -eq 1
          bash -n docker/test-launcher-image.sh
          test -s vendor/canonical-auditor-readiness/readiness/index.html
          if [ "$TARGET" = web ]; then
            test -s vendor/opto-sync-clients/clients/ts/package.json
          fi
      - name: Build the actual selected service image
        run: docker build --progress=plain --target "$TARGET" --tag ores-launcher:ci .
      - name: Certify the shell-free image contract
        run: bash docker/test-launcher-image.sh ores-launcher:ci "$APP"
