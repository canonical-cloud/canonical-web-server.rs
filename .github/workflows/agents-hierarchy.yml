name: Agent instruction hierarchy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify canonical agent-policy layout
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test ! -e agents.md
          grep -Fq 'git rebase' AGENTS.md
          grep -Fq 'git merge' AGENTS.md
          grep -Fq 'git stash' AGENTS.md
          grep -Fq 'git reset' AGENTS.md
          grep -Fq 'git clean' AGENTS.md
          grep -Eq 'force[- ]push|git push --force' AGENTS.md
          grep -Fq 'worktree' AGENTS.md
          grep -Fq 'ore-primary-branch-policy:begin' AGENTS.md
          grep -Fq 'ore-primary-branch-policy:end' AGENTS.md
