name: publish containers

on:
  pull_request:
    paths:
      - .github/workflows/publish-containers.yml
      - release/current-containers.env
      - Dockerfile
      - Cargo.toml
      - Cargo.lock
      - client/**
      - crates/**
      - migrations/**
      - src/**
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-containers.yml
      - release/current-containers.env
      - Dockerfile
      - Cargo.toml
      - Cargo.lock
      - client/**
      - crates/**
      - migrations/**
      - src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate declared release source and package namespace
        shell: bash
        run: |
          set -euo pipefail
          source release/current-containers.env
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PACKAGE" = 'ghcr.io/canonical-cloud/canonical-web-server-rs'
          test "$WEB_IMAGE" = "${PACKAGE}:web-${SOURCE_SHA}"
          test "$REVOKER_IMAGE" = "${PACKAGE}:revoker-${SOURCE_SHA}"
          git cat-file -e "${SOURCE_SHA}^{commit}"

      - name: Build both production targets without publishing
        run: |
          set -euo pipefail
          docker build --pull --target web --tag canonical-web-server:pr .
          docker build --pull --target revoker --tag canonical-session-revoker:pr .

      - name: Verify non-root image users and entrypoints
        run: |
          set -euo pipefail
          test "$(docker image inspect canonical-web-server:pr --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect canonical-session-revoker:pr --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect canonical-web-server:pr --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/canonical-web-server"]'
          test "$(docker image inspect canonical-session-revoker:pr --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/canonical-session-revoker"]'

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      statuses: write
    steps:
      - name: Check out release declaration and full source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the declared immutable release
        shell: bash
        run: |
          set -euo pipefail
          source release/current-containers.env
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PACKAGE" = 'ghcr.io/canonical-cloud/canonical-web-server-rs'
          test "$WEB_IMAGE" = "${PACKAGE}:web-${SOURCE_SHA}"
          test "$REVOKER_IMAGE" = "${PACKAGE}:revoker-${SOURCE_SHA}"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          printf 'SOURCE_SHA=%s\nPACKAGE=%s\nWEB_IMAGE=%s\nREVOKER_IMAGE=%s\n' \
            "$SOURCE_SHA" "$PACKAGE" "$WEB_IMAGE" "$REVOKER_IMAGE" >> "$GITHUB_ENV"
          git worktree add ../release-source "$SOURCE_SHA"

      - name: Publish pending release status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg state pending \
            --arg context canonical-containers/published \
            --arg description 'Building and verifying the declared immutable GHCR release' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}"

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Prove write access to the repository-owned package before the expensive build
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="${RUNNER_TEMP}/canonical-ghcr-probe"
          mkdir -p "$probe_dir"
          cat > "${probe_dir}/Dockerfile" <<EOF
          FROM scratch
          LABEL org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}"
          LABEL org.opencontainers.image.revision="${SOURCE_SHA}"
          EOF
          probe_image="${PACKAGE}:permission-probe"
          docker build --tag "$probe_image" "$probe_dir"
          docker push "$probe_image"
          docker image rm "$probe_image"
          docker pull --quiet "$probe_image"
          test "$(docker image inspect "$probe_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"

      - name: Build immutable release images from the declared source
        working-directory: ../release-source
        run: |
          set -euo pipefail
          common_labels=(
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${SOURCE_SHA}"
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          )
          docker build --pull --target web \
            "${common_labels[@]}" \
            --tag "$WEB_IMAGE" .
          docker build --pull --target revoker \
            "${common_labels[@]}" \
            --tag "$REVOKER_IMAGE" .

      - name: Push both immutable component tags
        run: |
          set -euo pipefail
          docker push "$WEB_IMAGE"
          docker push "$REVOKER_IMAGE"

      - name: Pull back and inspect the remote release
        run: |
          set -euo pipefail
          docker image rm "$WEB_IMAGE" "$REVOKER_IMAGE"
          docker pull --quiet "$WEB_IMAGE"
          docker pull --quiet "$REVOKER_IMAGE"
          test "$(docker image inspect "$WEB_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$REVOKER_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$WEB_IMAGE" --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect "$REVOKER_IMAGE" --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect "$WEB_IMAGE" --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/canonical-web-server"]'
          test "$(docker image inspect "$REVOKER_IMAGE" --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/canonical-session-revoker"]'

      - name: Record registry digests
        run: |
          set -euo pipefail
          web_digest="$(docker image inspect "$WEB_IMAGE" --format '{{index .RepoDigests 0}}')"
          revoker_digest="$(docker image inspect "$REVOKER_IMAGE" --format '{{index .RepoDigests 0}}')"
          {
            echo '## Canonical Cloud immutable containers'
            echo
            echo "- Source revision: \`${SOURCE_SHA}\`"
            echo "- Package: \`${PACKAGE}\`"
            echo "- Web: \`${web_digest}\`"
            echo "- Revoker: \`${revoker_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish successful release status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg state success \
            --arg context canonical-containers/published \
            --arg description 'Both immutable component tags were pushed, pulled back, and inspected' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}"

      - name: Publish failed release status
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source release/current-containers.env
          payload="$(jq -nc \
            --arg state failure \
            --arg context canonical-containers/published \
            --arg description 'Repository-owned GHCR publication or pull-back verification failed' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}"

      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io || true
