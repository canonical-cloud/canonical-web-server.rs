name: Verify ores-otel adoption

on:
  pull_request:
    paths:
      - '.github/workflows/otel-web-refresh.yml'
      - '.zpkg.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/server.rs'
      - 'docs/otel-web-bridge.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/otel-web-refresh.yml'
      - '.zpkg.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/server.rs'
      - 'docs/otel-web-bridge.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otel-web-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Install Node.js for the committed client assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Enforce application-repository release boundary
        run: node tests/release-boundary.mjs

      - name: Build the client without publishing
        run: |
          set -euo pipefail
          npm ci --prefix client
          npm run typecheck --prefix client
          npm test --prefix client
          npm run build --prefix client

      - name: Verify committed Rust dependency and source state
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 >/dev/null
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          git diff --exit-code -- Cargo.lock src/server.rs

# This verifier never generates commits, pushes branches, publishes releases,
# decrypts secrets, or replaces the repository's protected CI/browser/RLS/
# container checks. canonical-monorepo remains the sole release publisher.
