name: one-shot rustls security refresh

on:
  push:
    branches: [audit/org-policy-rollout-20260915]
    paths:
      - '.github/workflows/rustls-security-refresh-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustls-security-refresh-once
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'canonical-cloud/canonical-web-server.rs' && github.ref == 'refs/heads/audit/org-policy-rollout-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/org-policy-rollout-20260915
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Regenerate patched rustls lock graph
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls@0.23.43 --precise 0.23.45
          grep -A2 '^name = "rustls"$' Cargo.lock | grep -F 'version = "0.23.45"'
          git diff --check

      - name: Verify locked application graph
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify RustSec remediation
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit \
            --deny unmaintained \
            --deny unsound \
            --deny yanked \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2026-0235

      - name: Commit generated lockfile only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- . ':!Cargo.lock')"
          git add -- Cargo.lock
          git diff --cached --quiet && { echo 'No lockfile update produced' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: update rustls to 0.23.45'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Publish verified lockfile remediation
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push origin HEAD:refs/heads/audit/org-policy-rollout-20260915
