name: one-shot AGENTS case migration

on:
  push:
    branches: [audit/org-policy-rollout-20260915]
    paths:
      - '.github/workflows/agent-policy-case-migration-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: github.repository == 'canonical-cloud/canonical-web-server.rs' && github.ref == 'refs/heads/audit/org-policy-rollout-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/org-policy-rollout-20260915
          fetch-depth: 0
          persist-credentials: false

      - name: Migrate the real policy to canonical uppercase path
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f agents.md
          cp agents.md "$RUNNER_TEMP/canonical-agents.md"
          cp "$RUNNER_TEMP/canonical-agents.md" AGENTS.md
          git rm -- agents.md
          grep -Fq '## Security invariants' AGENTS.md
          grep -Fq 'Do not rebase, reset' AGENTS.md
          grep -Fq 'worktree' AGENTS.md
          git diff --check

      - name: Commit the case-safe migration
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -- AGENTS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'policy: migrate agent guidance to canonical AGENTS.md'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Publish migrated policy
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push origin HEAD:refs/heads/audit/org-policy-rollout-20260915
